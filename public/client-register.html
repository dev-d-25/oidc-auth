<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register OAuth Client</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --fg: #09090b;
      --muted: #71717a;
      --border: #e4e4e7;
      --input-bg: #ffffff;
      --ring: #18181b;
      --card-bg: #ffffff;
      --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .1), 0 1px 2px -1px rgb(0 0 0 / .1);
      --radius: 0.5rem;
      --btn-bg: #18181b;
      --btn-fg: #fafafa;
      --btn-hover: #27272a;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --input-bg: #09090b;
        --ring: #d4d4d8;
        --card-bg: #18181b;
        --card-shadow: 0 1px 3px 0 rgb(0 0 0 / .4), 0 1px 2px -1px rgb(0 0 0 / .4);
        --btn-bg: #fafafa;
        --btn-fg: #18181b;
        --btn-hover: #e4e4e7;
      }
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: var(--card-shadow);
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .icon {
      width: 40px;
      height: 40px;
      background: var(--fg);
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--muted);
      margin-top: 0.35rem;
    }

    .form { display: flex; flex-direction: column; gap: 1rem; }

    .field { display: flex; flex-direction: column; gap: 0.4rem; }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--fg);
    }

    input, textarea {
      width: 100%;
      padding: 0 0.75rem;
      font-family: inherit;
      font-size: 0.875rem;
      color: var(--fg);
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input { height: 2.375rem; }
    textarea { padding: 0.6rem 0.75rem; resize: vertical; min-height: 80px; }

    input::placeholder, textarea::placeholder { color: var(--muted); }

    input:focus, textarea:focus {
      border-color: var(--ring);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 20%, transparent);
    }

    .hint {
      font-size: 0.75rem;
      color: var(--muted);
    }

    button[type="submit"] {
      width: 100%;
      height: 2.375rem;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--btn-fg);
      background: var(--btn-bg);
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 0.25rem;
      transition: background 0.15s, opacity 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    button[type="submit"]:hover { background: var(--btn-hover); }
    button[type="submit"]:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 14px;
      height: 14px;
      border: 2px solid color-mix(in srgb, var(--btn-fg) 30%, transparent);
      border-top-color: var(--btn-fg);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error-msg, .success-msg {
      display: none;
      font-size: 0.8125rem;
      border-radius: var(--radius);
      padding: 0.625rem 0.75rem;
    }

    .error-msg {
      color: #ef4444;
      background: color-mix(in srgb, #ef4444 10%, transparent);
      border: 1px solid color-mix(in srgb, #ef4444 25%, transparent);
    }

    .success-msg {
      color: #16a34a;
      background: color-mix(in srgb, #16a34a 10%, transparent);
      border: 1px solid color-mix(in srgb, #16a34a 25%, transparent);
    }

    .credentials {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      background: color-mix(in srgb, var(--muted) 8%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .credentials h3 {
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .cred-field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      margin-bottom: 0.75rem;
    }

    .cred-field:last-child { margin-bottom: 0; }

    .cred-label {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
    }

    .cred-value {
      font-size: 0.8125rem;
      font-family: 'Courier New', monospace;
      background: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px);
      padding: 0.4rem 0.6rem;
      word-break: break-all;
    }

    .warning {
      font-size: 0.75rem;
      color: #ca8a04;
      background: color-mix(in srgb, #ca8a04 10%, transparent);
      border: 1px solid color-mix(in srgb, #ca8a04 25%, transparent);
      border-radius: var(--radius);
      padding: 0.5rem 0.75rem;
      margin-top: 0.75rem;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--bg)">
          <rect x="2" y="2" width="20" height="20" rx="2"/>
          <path d="M7 8h10M7 12h10M7 16h6"/>
        </svg>
      </div>
      <h1>Register OAuth Client</h1>
      <p class="subtitle">Get your client ID and secret</p>
    </div>

    <form class="form" id="registerForm" novalidate>
      <div id="errorMsg" class="error-msg" role="alert"></div>
      <div id="successMsg" class="success-msg" role="status"></div>

      <div class="field">
        <label for="clientName">Company/Client Name</label>
        <input id="clientName" name="clientName" type="text" placeholder="Acme Corp" required />
      </div>

      <div class="field">
        <label for="redirectUris">Redirect URIs</label>
        <textarea id="redirectUris" name="redirectUris" placeholder="https://yourapp.com/callback&#10;https://yourapp.com/auth/callback" required></textarea>
        <span class="hint">Enter one URI per line</span>
      </div>

      <button type="submit" id="submitBtn">
        <span class="spinner" id="spinner"></span>
        <span id="btnText">Register Client</span>
      </button>
    </form>

    <div class="credentials" id="credentials">
      <h3>Client Credentials</h3>
      <div class="cred-field">
        <span class="cred-label">Client ID</span>
        <div class="cred-value" id="clientId"></div>
      </div>
      <div class="cred-field">
        <span class="cred-label">Client Secret</span>
        <div class="cred-value" id="clientSecret"></div>
      </div>
      <div class="warning">
        Save these credentials securely. The client secret will not be shown again.
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const credentials = document.getElementById('credentials');

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      successMsg.style.display = 'none';
      credentials.style.display = 'none';
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successMsg.style.display = 'block';
      errorMsg.style.display = 'none';
    }

    function hideMessages() {
      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';
    }

    function setLoading(loading) {
      submitBtn.disabled = loading;
      spinner.style.display = loading ? 'block' : 'none';
      btnText.textContent = loading ? 'Registering…' : 'Register Client';
    }

    function showCredentials(clientId, clientSecret) {
      document.getElementById('clientId').textContent = clientId;
      document.getElementById('clientSecret').textContent = clientSecret;
      credentials.style.display = 'block';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideMessages();

      const clientName = document.getElementById('clientName').value.trim();
      const redirectUrisText = document.getElementById('redirectUris').value.trim();

      if (!clientName || !redirectUrisText) {
        showError('Please fill in all fields.');
        return;
      }

      const redirectUris = redirectUrisText.split('\n').map(uri => uri.trim()).filter(uri => uri);

      if (redirectUris.length === 0) {
        showError('Please enter at least one redirect URI.');
        return;
      }

      setLoading(true);

      try {
        const res = await fetch('/o/client/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            clientName,
            redirectUris,
          }),
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          showError(data.message || 'Failed to register client.');
        } else {
          showSuccess('Client registered successfully!');
          showCredentials(data.data.clientId, data.data.clientSecret);
        }
      } catch {
        showError('Something went wrong. Please try again.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
